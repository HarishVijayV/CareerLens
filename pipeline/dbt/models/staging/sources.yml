version: 2

sources:
  - name: raw
    description: >
      Landing tables loaded by pipeline/ingestion/load_to_warehouse.py after the Spark
      ETL step writes curated Parquet. dbt never reads Parquet directly — it transforms
      whatever's already inside the warehouse, which is the actual division of labor
      between Spark (heavy processing) and dbt (SQL modeling) described in
      docs/DATA_ENGINEERING.md.
    schema: raw
    tables:
      - name: postings
        description: One row per cleaned job posting, as produced by the Spark ETL job.
