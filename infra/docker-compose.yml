# CareerLens — local infrastructure
#
# Default services (no profile needed) = everything the WEB APP needs day-to-day:
#   postgres, redis, kafka, adminer, gateway, auth-service, agent-service,
#   worker-service, notification-service
#
# `bigdata` profile = the heavier data-engineering stack, started only when you're
# actually working on the pipeline (Hadoop + Airflow are resource-hungry, no point
# running them while you're just building login pages):
#   docker compose --profile bigdata up -d
#
# See docs/LOCAL_SETUP.md for full instructions.

services:
  # ---------------------------------------------------------------- core infra
  postgres:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kafka in KRaft mode — no separate ZooKeeper needed (KRaft replaced it in modern Kafka).
  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka_data:/bitnami/kafka

  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  # ---------------------------------------------------------------- app services
  gateway:
    build: ../services/gateway
    env_file: .env
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../services/gateway/app:/app/app

  auth-service:
    build: ../services/auth-service
    env_file: .env
    ports:
      - "${AUTH_SERVICE_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../services/auth-service/app:/app/app

  agent-service:
    build: ../services/agent-service
    env_file: .env
    ports:
      - "${AGENT_SERVICE_PORT:-8002}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../services/agent-service/app:/app/app

  jobs-service:
    build: ../services/jobs-service
    env_file: .env
    ports:
      - "${JOBS_SERVICE_PORT:-8003}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../services/jobs-service/app:/app/app

  worker-service:
    build: ../services/worker-service
    env_file: .env
    command: celery -A app.celery_app worker --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ../services/worker-service/app:/app/app

  notification-service:
    build: ../services/notification-service
    env_file: .env
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8004}:8000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../services/notification-service/app:/app/app

  # ---------------------------------------------------------------- bigdata profile
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    environment:
      - CLUSTER_NAME=careerlens
    env_file: ./hadoop.env
    ports:
      - "9870:9870" # HDFS web UI
      - "9000:9000"
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    profiles: [bigdata]

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    environment:
      - SERVICE_PRECONDITION=namenode:9870
    env_file: ./hadoop.env
    depends_on:
      - namenode
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    profiles: [bigdata]

  airflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    profiles: [bigdata]

  airflow-init:
    image: apache/airflow:2.9.3-python3.11
    depends_on:
      - airflow-db
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username admin --password admin --firstname admin --lastname admin --role Admin --email admin@example.com"
    profiles: [bigdata]

  airflow-webserver:
    image: apache/airflow:2.9.3-python3.11
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    command: webserver
    ports:
      - "8080:8080"
    volumes:
      - ../pipeline/airflow/dags:/opt/airflow/dags
      - ../pipeline:/opt/airflow/pipeline
    profiles: [bigdata]

  airflow-scheduler:
    image: apache/airflow:2.9.3-python3.11
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    command: scheduler
    volumes:
      - ../pipeline/airflow/dags:/opt/airflow/dags
      - ../pipeline:/opt/airflow/pipeline
    profiles: [bigdata]

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  hadoop_namenode:
  hadoop_datanode:
  airflow_db_data:
