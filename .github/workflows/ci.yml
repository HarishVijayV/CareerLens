# CI: lint, test, and build every image on push/PR.
#
# The point of a portfolio CI file is to show you understand the SHAPE of a delivery
# pipeline — test before build, build before publish, publish only from main. Deployment
# itself is Phase 8 (docs/ROADMAP.md); the job is written and commented but disabled,
# because a workflow that references secrets nobody has would just fail red on every push
# and teach you to ignore CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff
          pip install -r services/auth-service/requirements.txt
          pip install faker httpx

      - name: Lint
        # Fail on real errors, not style opinions — a linter that cries wolf gets ignored.
        run: ruff check services/ pipeline/ tests/ --select E9,F63,F7,F82

      - name: Run tests
        run: pytest tests/ -v

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    name: Build images
    runs-on: ubuntu-latest
    needs: [test, frontend]   # never build an image from code that failed its tests
    strategy:
      matrix:
        service: [gateway, auth-service, agent-service, jobs-service, worker-service, notification-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: false          # flip to true once the registry login below is enabled
          tags: careerlens/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------- Phase 8, disabled
  # Enable by removing `if: false` after setting up a registry + cluster credentials.
  publish:
    name: Push to registry
    runs-on: ubuntu-latest
    needs: [docker]
    if: false && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/gateway
          push: true
          # Tag with the commit SHA, not just `latest`: every deploy is then traceable to
          # exact source, and a rollback is redeploying a known-good tag.
          tags: |
            ghcr.io/${{ github.repository }}/gateway:${{ github.sha }}
            ghcr.io/${{ github.repository }}/gateway:latest
