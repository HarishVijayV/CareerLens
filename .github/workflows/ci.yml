# CI/CD: push -> test -> build images -> publish to registry -> (deploy).
#
# The ORDER is the whole point of a pipeline: nothing gets built from code that failed its
# tests, and nothing gets published from an image that failed to build. Each gate protects
# the one after it.
#
# Publishing runs only on `main`. A pull request should prove it *would* build without
# putting an unreviewed image where something could deploy it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------- 1. test
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff
          pip install -r services/auth-service/requirements.txt
          pip install faker httpx

      - name: Lint
        # Only real errors (undefined names, syntax) — not style opinions. A linter that
        # fails builds over formatting gets disabled within a week.
        run: ruff check services/ pipeline/ tests/ --select E9,F63,F7,F82

      - name: Run tests
        run: pytest tests/ -v

  # ---------------------------------------------------------------- 2. frontend
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend

      # Next generates route types (LayoutProps, PageProps) into .next/types during dev
      # and build. app/layout.tsx uses LayoutProps<"/">, so typechecking BEFORE those
      # exist fails with "Cannot find name 'LayoutProps'" — which is exactly what CI hit,
      # while every local run passed because .next was already populated by `next dev`.
      #
      # `next typegen` generates them without a full build. Keeping tsc as its own step
      # (rather than relying on the build's internal typecheck) means a type error is
      # reported as a type error instead of a build failure.
      - run: npx next typegen
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

  # ---------------------------------------------------------------- 3. helm
  helm:
    name: Validate Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint k8s/helm/careerlens
      - name: Render templates
        # Catches template errors that lint misses, and proves the chart produces valid
        # YAML before anything tries to apply it to a cluster.
        run: helm template careerlens k8s/helm/careerlens > /dev/null

  # ---------------------------------------------------------------- 4. build & publish
  images:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: [test, frontend, helm]     # never build from code that failed a gate
    permissions:
      contents: read
      packages: write                 # required to push to GHCR
    strategy:
      fail-fast: false                # one failing image shouldn't hide the others
      matrix:
        include:
          - { name: gateway,              context: services/gateway }
          - { name: auth-service,         context: services/auth-service }
          - { name: jobs-service,         context: services/jobs-service }
          - { name: agent-service,        context: services/agent-service }
          - { name: worker-service,       context: services/worker-service }
          - { name: notification-service, context: services/notification-service }
          - { name: mcp-server,           context: services/mcp-server }
          - { name: frontend,             context: frontend }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Only on main: a PR build proves it compiles without publishing anything.
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # provided automatically, no setup needed

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
          # Two tags on purpose. `latest` is convenient; the SHA tag is what makes a
          # deploy traceable to exact source and a rollback just "redeploy the previous
          # SHA". Deploying `latest` alone means you cannot tell what is actually running.

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------- 5. deploy
  deploy:
    name: Deploy to cluster
    runs-on: ubuntu-latest
    needs: [images]
    if: false      # <-- flip to `github.ref == 'refs/heads/main'` once a cluster exists
    #
    # Disabled deliberately rather than deleted. A deploy job referencing a KUBE_CONFIG
    # secret nobody has would fail red on every push, and a CI badge that is always red
    # is a CI system people stop reading.
    #
    # To enable (see docs/CLOUD_LEARNING_PLAN.md):
    #   1. Get a cluster (kind locally, or k3s on an Oracle Always Free VM)
    #   2. base64 your kubeconfig and store it as the KUBE_CONFIG repo secret
    #   3. Create the app secret IN the cluster — never in CI:
    #        kubectl create secret generic careerlens-secrets --from-literal=...
    #   4. Change `if: false` above
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy
        run: |
          helm upgrade --install careerlens k8s/helm/careerlens \
            --set global.imageRegistry=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }} \
            --set global.imageTag=sha-${{ github.sha }} \
            --set global.imagePullPolicy=Always \
            --wait --timeout 10m
          # --wait blocks until pods are actually Ready, so a broken release fails the
          # build instead of reporting success while pods crash-loop.

      - name: Roll back on failure
        if: failure()
        # This is the self-healing you asked about, at the DEPLOY layer. Probes restart a
        # sick pod; this reverts a bad release. `helm rollback` restores the previous
        # revision's manifests, so a failed deploy self-corrects instead of leaving the
        # cluster in a half-updated state.
        run: helm rollback careerlens --wait --timeout 5m

      - name: Verify
        run: |
          kubectl rollout status deployment/careerlens-gateway --timeout=3m
          kubectl get pods -l app.kubernetes.io/instance=careerlens
